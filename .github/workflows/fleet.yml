name: fleet
on:
  push:
    paths: ['fleet/**', '.github/workflows/fleet.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: fleet/go.mod }
      - run: cd fleet && go test ./... && ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-linux
          path: fleet/dist/*
